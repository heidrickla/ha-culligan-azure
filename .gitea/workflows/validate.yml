name: Validate

# Runs on the forge's self-hosted act_runner. GitHub is the primary CI
# (.github/workflows/tests.yml and validate.yml); this is the forge's copy.
#
# THE RUNNER IS SHARED AND ITS CAPACITY IS 1. Other agent sessions queue behind
# anything pushed here, so an ordinary push runs ONE fast job. Anything that
# installs Home Assistant is workflow_dispatch only.

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  lint:
    name: Lint and structure
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        timeout-minutes: 15

      # The runner image ships Python 3.10, which cannot parse the PEP 695
      # `type X = ...` alias in coordinator.py; the validator needs newer.
      - uses: actions/setup-python@v5
        timeout-minutes: 15
        with:
          python-version: "3.13"

      # Pinned: an unpinned linter makes CI non-reproducible.
      - name: Install (PINNED)
        timeout-minutes: 15
        run: |
          python -m pip install --quiet --upgrade pip
          python -m pip install --quiet "ruff==0.15.21" "PyYAML==6.0.2"
          python -m ruff --version

      - name: Ruff
        timeout-minutes: 15
        run: |
          python -m ruff check .
          python -m ruff format --check .

      - name: JSON is valid
        timeout-minutes: 15
        run: |
          for f in custom_components/culligan_azure/*.json custom_components/culligan_azure/translations/*.json hacs.json; do
            python -c "import json,sys; json.load(open(sys.argv[1],encoding='utf-8'))" "$f" || exit 1
          done
          echo "all JSON valid"

      # A venv of its own: pytest in the shared toolcache Python autoloads
      # plugins other jobs installed there, and a stale aiodns beside a newer
      # pycares failed every run from 2026-09-04.
      - name: Pure tests
        timeout-minutes: 15
        run: |
          python -m venv .venv-pure
          .venv-pure/bin/python -m pip install --quiet "pytest==9.0.3"
          .venv-pure/bin/python -m pytest --durations=15 --junitxml=reports/junit-1.xml tests/test_health.py tests/test_resin.py tests/test_capabilities.py -q

      # Manifest, translations, icons, actions, exceptions and the quality
      # scale against the pinned rule list.
      - name: Offline validator
        timeout-minutes: 15
        run: python tools/validate_local.py

      # each test's time and result, kept whatever the outcome: the forge shows no job log
      - name: test results
        if: always()
        timeout-minutes: 5
        uses: actions/upload-artifact@ff15f0306b3f739f7b6fd43fb5d26cd321bd4de5 # v3.2.1
        with:
          name: test-results-${{ github.job }}
          path: reports/
          retention-days: 14

  # Installs Home Assistant, so it is manual only and never occupies the shared
  # runner on an ordinary push. Mirrors the GitHub Tests job.
  home-assistant:
    name: Home Assistant layer
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        timeout-minutes: 15

      # Home Assistant 2026.x needs Python 3.14.
      - uses: actions/setup-python@v5
        timeout-minutes: 15
        with:
          python-version: "3.14"

      # A venv outside the checkout: the runner's setup-python toolcache is
      # shared with other repos' jobs. uv installs the same packages as pip
      # did (compared 2026-10-30) in a quarter of the time; 0.11.31 is the uv
      # the harness itself pins.
      - name: Install
        timeout-minutes: 15
        run: |
          python -m venv "$RUNNER_TEMP/venv"
          "$RUNNER_TEMP/venv/bin/python" -m pip install --quiet "uv==0.11.31"
          "$RUNNER_TEMP/venv/bin/python" -m uv pip install --quiet \
            --python "$RUNNER_TEMP/venv/bin/python" \
            "mypy==1.18.2" "pytest-homeassistant-custom-component==0.13.357"

      - name: Pure tests
        timeout-minutes: 15
        run: >
          "$RUNNER_TEMP/venv/bin/python" -m pytest --durations=15 --junitxml=reports/junit-2.xml
          tests/test_health.py tests/test_resin.py
          tests/test_capabilities.py tests/test_api.py -q -p no:homeassistant
          --cov=custom_components/culligan_azure --cov-report=

      - name: Home Assistant layer tests and the coverage gate
        timeout-minutes: 15
        run: >
          "$RUNNER_TEMP/venv/bin/python" -m pytest --durations=15 --junitxml=reports/junit-3.xml tests/ha -q
          --cov=custom_components/culligan_azure --cov-append
          --cov-report=term-missing --cov-fail-under=95

      - name: mypy strict
        timeout-minutes: 15
        run: '"$RUNNER_TEMP/venv/bin/python" -m mypy'

      # each test's time and result, kept whatever the outcome: the forge shows no job log
      - name: test results
        if: always()
        timeout-minutes: 5
        uses: actions/upload-artifact@ff15f0306b3f739f7b6fd43fb5d26cd321bd4de5 # v3.2.1
        with:
          name: test-results-${{ github.job }}
          path: reports/
          retention-days: 14

  # hacs/action reads the repository through the GitHub API, so it cannot
  # check this tree here; .github/workflows/validate.yml runs it on GitHub.
  hassfest:
    name: hassfest
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        timeout-minutes: 15
      - uses: home-assistant/actions/hassfest@06749dd8c0b54f350bc69c8752456cee498808a3 # master
        timeout-minutes: 15
