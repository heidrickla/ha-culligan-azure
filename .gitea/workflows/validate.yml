name: Validate

# Runs on the self-hosted act_runner on gpurack2. GitHub is the primary CI
# (.github/workflows/tests.yml and validate.yml); this is the forge's copy.
#
# THE RUNNER IS SHARED AND ITS CAPACITY IS 1. Other agent sessions queue behind
# anything pushed here, so an ordinary push runs ONE fast job. Anything that
# installs Home Assistant is workflow_dispatch only.

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  lint:
    name: Lint and structure
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # The runner image ships Python 3.10, which cannot parse the PEP 695
      # `type X = ...` alias in coordinator.py; the validator needs newer.
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      # Pinned: an unpinned linter makes CI non-reproducible.
      - name: Install (PINNED)
        run: |
          python -m pip install --quiet --upgrade pip
          python -m pip install --quiet "ruff==0.15.21" "PyYAML==6.0.2"
          python -m ruff --version

      - name: Ruff
        run: |
          python -m ruff check .
          python -m ruff format --check .

      - name: JSON is valid
        run: |
          for f in custom_components/culligan_azure/*.json hacs.json; do
            python -c "import json,sys; json.load(open(sys.argv[1],encoding='utf-8'))" "$f" || exit 1
          done
          echo "all JSON valid"

      - name: Pure tests
        run: |
          python -m pip install --quiet "pytest==9.0.3"
          python -m pytest tests/test_health.py tests/test_resin.py tests/test_capabilities.py -q

      # Manifest, translations, icons, actions, exceptions and the quality
      # scale against the pinned rule list.
      - name: Offline validator
        run: python tools/validate_local.py

  # Installs Home Assistant, so it is manual only and never occupies the shared
  # runner on an ordinary push. Mirrors the GitHub Tests job.
  home-assistant:
    name: Home Assistant layer
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Home Assistant 2026.x needs Python 3.14.
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Install
        run: |
          python -m pip install --quiet --upgrade pip
          python -m pip install --quiet "mypy==1.18.2" \
            "pytest-homeassistant-custom-component==0.13.357"

      - name: Pure tests
        run: >
          python -m pytest tests/test_health.py tests/test_resin.py
          tests/test_capabilities.py tests/test_api.py -q -p no:homeassistant
          --cov=custom_components/culligan_azure --cov-report=

      - name: Home Assistant layer tests and the coverage gate
        run: >
          python -m pytest tests/ha -q
          --cov=custom_components/culligan_azure --cov-append
          --cov-report=term-missing --cov-fail-under=95

      - name: mypy strict
        run: python -m mypy

  hacs:
    name: hassfest + HACS
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: home-assistant/actions/hassfest@a7c616ce81ccda50150bf1595786c71b1883fabb # master
      - uses: hacs/action@d556e736723344f83838d08488c983a15381059a # 22.5.0
        with:
          category: integration
