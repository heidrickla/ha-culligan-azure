# Status of every Integration Quality Scale rule, checked against the pinned
# list in tools/validate_local.py. `todo` means the rule is not met and says
# why; `exempt` is used only where the rule page allows it. A custom
# integration builds to these rules and claims no tier in its manifest.
#
# The Home Assistant layer tests, mypy and the validator run in the GitHub
# `Tests` workflow (.github/workflows/tests.yml) on every push.
rules:
  # Bronze
  action-setup:
    status: done
    comment: |
      Both actions are registered in async_setup, so a call while the entry
      is unloaded gets the translated not_loaded refusal instead of an
      unknown-service error.
  appropriate-polling:
    status: done
    comment: |
      120 seconds by default, 30 at the least. One GET /device/registry per
      poll returns every device and all its telemetry.
  brands:
    status: done
    comment: |
      Brand images ship in-repo at custom_components/culligan_azure/brand/,
      which Home Assistant serves from 2026.3.0; hacs.json sets that floor so
      no supported install shows the placeholder.
  common-modules: done
  config-flow-test-coverage:
    status: done
    comment: |
      tests/ha/test_config_flow.py covers the user step, a trimmed and
      lowercased email, every error branch followed by recovery to
      CREATE_ENTRY or the abort, the duplicate abort, reconfigure including
      its own no_devices branch, the another_account guard and the
      blank-password case, reauth in both
      outcomes and recovery, and the options flow with every field. Coverage
      is reported by the Tests job.
  config-flow: done
  dependency-transparency:
    status: done
    comment: |
      requirements is empty. The Azure API is spoken to over Home
      Assistant's own aiohttp session, so there is nothing to be transparent
      about.
  docs-actions: done
  docs-conditions:
    status: exempt
    comment: This integration does not provide conditions.
  docs-high-level-description: done
  docs-installation-instructions: done
  docs-removal-instructions: done
  docs-triggers:
    status: exempt
    comment: This integration does not provide triggers.
  entity-event-setup:
    status: exempt
    comment: |
      Entities do not subscribe to events of their own; the coordinator
      subscription is CoordinatorEntity's, made in async_added_to_hass.
  entity-unique-id: done
  has-entity-name: done
  runtime-data: done
  test-before-configure: done
  test-before-setup: done
  unique-config-entry: done

  # Silver
  action-exceptions: done
  config-entry-unloading: done
  docs-configuration-parameters: done
  docs-installation-parameters: done
  entity-unavailable: done
  integration-owner: done
  log-when-unavailable:
    status: done
    comment: |
      The coordinator logs the poll failing once and recovering once. The
      /device/data fallback for firmware that omits properties does the
      same per device, at info on loss and on recovery, rather than logging
      on every poll.
  parallel-updates:
    status: done
    comment: |
      0 on sensor and binary_sensor, which only read the coordinator; 1 on
      button, number and switch, which each send a cloud command.
  reauthentication-flow: done
  test-coverage:
    status: done
    comment: |
      The rule asks for the floor on every module, so the Tests workflow
      gates twice: --cov-fail-under=95 over the pure and Home Assistant
      suites together, then tools/check_module_coverage.py over the
      per-file figures, which an aggregate lets a thin platform hide
      behind. api.py is exercised against a local HTTP server, including
      the 401 re-auth and its one-retry limit; every button, the number,
      both switches, diagnostics and the repair flow have tests of their
      own, and the entity guards, the controller stamp parser and the
      fault coercion are covered rather than excluded.

  # Gold
  devices:
    status: done
    comment: |
      One device per softener with manufacturer, model, controller firmware
      as sw_version and the serial. The Wi-Fi module firmware is in
      diagnostics, not hw_version.
  diagnostics:
    status: done
    comment: |
      Config with the credentials redacted, options, poll interval and, per
      device by position rather than serial, connection, model, both
      firmware versions, detected capabilities with the readings behind each
      verdict, the datapoint names and the derived health values.
  discovery:
    status: exempt
    comment: |
      The integration has no local protocol at all: softeners are addressed
      through the vendor cloud and enumerated from the account after login.
      Finding a unit on the network would give the config flow nothing it
      can use - it still needs the account credentials, and the device list
      still comes from the cloud.
  discovery-update-info:
    status: exempt
    comment: |
      Nothing local is stored to update. The entry holds an account, not a
      host, and every request goes to uniapi.culliganiot.com.
  docs-data-update: done
  docs-examples: done
  docs-known-limitations: done
  docs-supported-devices: done
  docs-supported-functions: done
  docs-troubleshooting: done
  docs-use-cases: done
  dynamic-devices: done
  entity-category: done
  entity-device-class:
    status: done
    comment: |
      DURATION on the day and minute sensors, VOLUME_STORAGE on the gallon
      readings, WATER on the two consumption totals, plus flow rate,
      timestamp and signal strength. VOLUME_STORAGE rather than VOLUME
      because Home Assistant accepts only the total state classes with
      VOLUME and these are measurements. Average daily use carries none:
      it is gallons per day, and no volume class means that.
  entity-disabled-by-default:
    status: done
    comment: |
      Wi-Fi signal, last power up, lifetime regeneration count, lifetime
      capacity average and both raw Aqua-Sensor readings are registered
      disabled.
  entity-translations: done
  exception-translations:
    status: done
    comment: |
      Every ConfigEntryAuthFailed, UpdateFailed, HomeAssistantError and
      ServiceValidationError carries a translation key; the validator
      refuses a raise without one.
  icon-translations:
    status: done
    comment: |
      Every icon lives in icons.json; no entity sets one in code. Where
      several entities on one device page would otherwise take the same
      class icon - the four problem binary sensors, the actual and expected
      regeneration intervals, the capacity readings - the override keeps
      them apart at a glance.
  reconfiguration-flow: done
  repair-issues:
    status: done
    comment: |
      A wrong controller clock raises a fixable repair per softener, and
      confirming it sends the clock command (repairs.py, cleared on the poll
      that shows the clock right or the softener gone). Rejected credentials
      already start a reauthentication flow, which Home Assistant surfaces
      itself; an account with no devices is a failed poll the entry retries,
      and an issue for it would only be telling the user something is wrong.
  stale-devices:
    status: done
    comment: |
      A coordinator listener drops devices for softeners the account stops
      returning, on every poll rather than only at setup, and
      async_remove_config_entry_device lets the user delete one by hand when
      polls keep failing. An empty poll result is treated as a failed read,
      never as an emptied account.

  # Platinum
  async-dependency:
    status: done
    comment: |
      There is no external dependency to be blocking: the client is in this
      repo and speaks aiohttp throughout, so no call leaves the event loop.
  inject-websession: done
  strict-typing:
    status: done
    comment: |
      pyproject sets mypy strict with nothing switched back off - no
      follow_imports, no ignore_missing_imports - and scopes the run to this
      integration, the way core scopes strict typing per integration. The
      Tests workflow runs it with Home Assistant installed, which is the run
      that counts, and the validator refuses this rule filed done if a
      relaxation reappears.
