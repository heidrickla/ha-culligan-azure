[tool.ruff]
line-length = 88
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "RUF"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101", "E501"]

# Home Assistant runs mypy in strict mode over integrations claiming the
# strict-typing rule. The Tests workflow runs this with Home Assistant
# installed, which is the check that counts; on a machine without it every
# class Home Assistant exports is Any and the run says little.
[tool.mypy]
python_version = "3.14"
strict = true
warn_return_any = true
disallow_untyped_defs = true
disallow_any_generics = true
no_implicit_reexport = true
ignore_missing_imports = true
follow_imports = "silent"

[[tool.mypy.overrides]]
module = "tests.*"
strict = false
disallow_untyped_defs = false

[tool.pytest.ini_options]
testpaths = ["tests"]
# pytest-homeassistant-custom-component's `hass` fixture is async and
# pytest does not handle async fixtures natively.
asyncio_mode = "auto"
