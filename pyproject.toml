[tool.ruff]
line-length = 88
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "RUF"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101", "E501"]

# Home Assistant runs mypy in strict mode over integrations claiming the
# strict-typing rule. The Tests workflow runs this with Home Assistant
# installed, which is the check that counts; on a machine without it every
# class Home Assistant exports is Any and the run says little.
#
# `files` scopes the run to the integration, the way core scopes strict typing
# per integration, so no per-module relaxation is needed to keep the test
# harness out of it. `strict = true` is left to imply its own flags rather than
# repeating them, and nothing is switched back off. The two disabled codes are
# the ones core disables for dependencies that ship no stubs, and neither hides
# an error in this integration's own code.
[tool.mypy]
python_version = "3.14"
files = ["custom_components/culligan_azure"]
strict = true
disable_error_code = ["import-not-found", "import-untyped"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# pytest-homeassistant-custom-component's `hass` fixture is async and
# pytest does not handle async fixtures natively.
asyncio_mode = "auto"
