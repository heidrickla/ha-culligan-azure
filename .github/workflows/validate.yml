name: Validate

on:
  workflow_dispatch:
  # Daily, because both gates answer a question whose ANSWER MOVES WITHOUT
  # THIS REPO CHANGING: hassfest and the HACS action validate against Home
  # Assistant's current requirements, which get stricter over time. A purely
  # push-triggered run answers "was this valid when we last edited it", not
  # "is it valid today".
  schedule:
    - cron: "0 0 * * *"
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

# Least privilege: nothing here writes to the repo, publishes, or comments on a
# PR, so no token scope is needed at all.
permissions: {}

# A push that supersedes an in-flight run makes that run's answer irrelevant.
# Cancelling frees the runner and stops a stale red/green arriving after a newer
# one. Keyed on ref so main and each PR are independent.
concurrency:
  group: validate-${{ github.ref }}
  cancel-in-progress: true

# Gitea's act_runner also picks up .github/workflows, so every job here is
# gated to GitHub. On the gitea forge these skip and
# .gitea/workflows/validate.yml is the one that runs - the runner is shared
# with capacity 1 and duplicate jobs queue behind each other.
#
# Lint, the test suites, mypy and the offline validator run in tests.yml.
jobs:
  hassfest: # https://developers.home-assistant.io/blog/2020/04/16/hassfest
    if: github.server_url == 'https://github.com'
    name: Hassfest validation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Run hassfest validation
        uses: home-assistant/actions/hassfest@a7c616ce81ccda50150bf1595786c71b1883fabb # master

  hacs: # https://github.com/hacs/action
    if: github.server_url == 'https://github.com'
    name: HACS validation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Run HACS validation
        uses: hacs/action@d556e736723344f83838d08488c983a15381059a # 22.5.0
        with:
          category: integration
